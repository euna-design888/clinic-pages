<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>병·의원 홈페이지 사전 정보 (10분)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{color-scheme:light;--c:#0b4f8a;--c2:#083a66;--tint:#eef4fa;--ink:#17212b;--sub:#5f6c7b;--line:#dfe5ec;--bg:#f6f8fa;--err:#c0392b}
*{box-sizing:border-box}html{scroll-behavior:smooth}[hidden]{display:none!important}
body{margin:0;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.6;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;word-break:keep-all;letter-spacing:-.01em}
.bar{position:fixed;top:0;left:0;right:0;height:4px;background:var(--line);z-index:5}.bar i{display:block;height:100%;background:var(--c);width:0;transition:width .3s}
.top{position:fixed;top:4px;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:.9rem;color:var(--sub);z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}
.top b{color:var(--c)}.top a{color:var(--sub);text-decoration:none;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:88px 20px 140px;min-height:100vh}
h1{font-size:2rem;line-height:1.25;margin:0 0 12px;letter-spacing:-.02em}h2{font-size:1.65rem;line-height:1.3;margin:0 0 8px;letter-spacing:-.02em}
.lead{color:var(--sub);margin:0 0 28px;font-size:1.05rem}
.q{margin:0 0 26px}.q>label,.q>.lb{display:block;font-weight:700;margin-bottom:8px}.q .lb i,.q label i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);vertical-align:middle;margin-left:6px}
.help{display:block;color:var(--sub);font-size:.9rem;font-weight:400;margin-top:6px}
input,textarea,select{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:0;transition:border .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--c);box-shadow:0 0 0 3px rgba(11,79,138,.12)}textarea{min-height:92px;resize:vertical}
.err{color:var(--err);font-size:.88rem;margin-top:6px;display:none}.q.bad .err{display:block}.q.bad input,.q.bad textarea{border-color:var(--err)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font:inherit;font-size:.97rem;padding:10px 16px;border:1.5px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;color:var(--ink);transition:.15s}
.chip:hover{border-color:var(--c)}.chip.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.card{font:inherit;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.card.on{border-color:var(--c);background:var(--tint);box-shadow:inset 0 0 0 1px var(--c)}.card b{display:block}.card small{color:var(--sub);font-size:.85rem}
.dcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.dcards{grid-template-columns:1fr}}
.dcard{padding:0;overflow:hidden;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:left;font:inherit}.dcard.on{border-color:var(--c);box-shadow:0 0 0 3px rgba(11,79,138,.15)}
.dcard img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}.dcard div{padding:12px 14px}.dcard b{display:block;font-size:1rem}.dcard small{color:var(--sub);font-size:.85rem;line-height:1.4;display:block}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:-1px;border:1px solid rgba(0,0,0,.12)}
.ccards{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.ccards{grid-template-columns:1fr}}
.ccard{padding:0;overflow:hidden;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:left;font:inherit;position:relative}.ccard.on{border-color:var(--c);box-shadow:0 0 0 3px rgba(11,79,138,.15)}
.ccard.on:after{content:"선택";position:absolute;top:10px;right:10px;background:var(--c);color:#fff;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px}
.ccard-b{padding:10px 14px 12px}.ccard-b b{display:block;font-size:1rem}.ccard-b small{color:var(--sub);font-size:.82rem;line-height:1.4;display:block}
.ct{aspect-ratio:16/10;padding:12px 14px;display:grid;grid-template-rows:auto 1fr auto;gap:6px;letter-spacing:-.02em}
.ct-top{display:flex;gap:6px;align-items:center}.ct-top i{width:10px;height:10px;border-radius:3px}.ct-top span{height:4px;width:18px;border-radius:2px;background:currentColor;opacity:.35}.ct-top span:first-of-type{margin-left:auto}
.ct-mid{display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px}.ct-mid b{font-size:1.5rem;line-height:1.1}.ct-blk{display:grid;gap:5px}.ct-blk i{display:block;width:64px;height:16px;border-radius:4px;background:currentColor;opacity:.25}.ct-blk i:first-child{opacity:1;height:22px}
.ct.round .ct-blk i,.ct.round .ct-top i{border-radius:999px}.ct.line .ct-blk i{background:transparent;border:1.5px solid currentColor;opacity:.8}.ct.line .ct-blk i:first-child{background:currentColor;border:0}
.ct-pal{display:flex;gap:4px;align-items:center}.ct-pal i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}.ct-pal em{font-style:normal;font-size:.72rem;opacity:.85;margin-left:6px;font-family:Pretendard,sans-serif;font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row2{grid-template-columns:1fr}}
.days{display:grid;gap:8px}.day{display:grid;grid-template-columns:64px 1fr auto 1fr;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.day.off{opacity:.55}.day select{padding:9px 10px}.day .tg{font:inherit;font-weight:700;padding:9px 0;border:0;border-radius:8px;background:var(--tint);color:var(--c);cursor:pointer}.day.off .tg{background:#eee;color:var(--sub)}
.day.off select{visibility:hidden}.day span{color:var(--sub)}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.presets .chip{font-size:.9rem;padding:8px 12px}
.doc{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;position:relative}.doc .x{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--sub);font-size:1.2rem;cursor:pointer}
.doc .row2{margin-bottom:8px}.doc textarea{min-height:64px}
.add{font:inherit;width:100%;padding:13px;border:1.5px dashed var(--c);border-radius:10px;background:var(--tint);color:var(--c);font-weight:700;cursor:pointer}
.up{margin-top:8px}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}.thumbs figure{margin:0;position:relative}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}.thumbs figcaption{font-size:.72rem;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.thumbs .x{position:absolute;right:4px;top:4px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px;font-size:.93rem;color:var(--sub);margin:0 0 24px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:5}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.btn{font:inherit;font-weight:700;padding:15px 26px;border-radius:12px;border:0;background:var(--c);color:#fff;cursor:pointer;font-size:1.05rem;min-width:140px}.btn:hover{background:var(--c2)}.btn.big{width:100%;padding:18px;font-size:1.15rem}
.ghost{font:inherit;background:none;border:0;color:var(--sub);cursor:pointer;font-size:1rem;padding:12px 8px}.skip{font-size:.9rem;color:var(--sub);background:none;border:0;cursor:pointer;text-decoration:underline;display:none;margin-left:auto}
.start{padding-top:12vh;text-align:left}.start h1{font-size:2.3rem}.start ul{padding-left:0;list-style:none;margin:0 0 32px;color:var(--sub)}.start li{padding:4px 0}.start li b{color:var(--ink)}
.done{padding-top:8vh}.done .box{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:24px;margin:20px 0}.done ol{padding-left:20px;color:var(--sub)}.done ol b{color:var(--ink)}
.summary{font-size:.92rem;color:var(--sub);background:var(--tint);border-radius:10px;padding:12px 14px;margin-top:14px;white-space:pre-wrap}
footer{text-align:center;color:var(--sub);font-size:.8rem;padding:20px}
</style></head><body>
<div class="bar"><i id="bar"></i></div>
<div class="top" id="top" hidden><span><b id="stepno"></b> <span id="steptitle"></span></span><a id="reset">처음부터</a></div>
<main id="main"></main>
<div class="nav" id="nav" hidden><div class="in"><button class="ghost" id="prev">← 이전</button><button class="skip" id="skip">일단 넘어가기</button><button class="btn" id="next">다음 →</button></div></div>

<script>

// ---------- 화면 ----------
const main=document.getElementById("main"),nav=document.getElementById("nav"),hdr=document.getElementById("top");
function render(){
  save();const n=STEPS.length;
  document.getElementById("bar").style.width=(step<=0?0:step>n?100:step/n*100)+"%";
  hdr.hidden=nav.hidden=!(step>=1&&step<=n);
  if(step<=0){main.innerHTML=`<div class="start"><h1>병·의원 홈페이지<br>사전 정보</h1><p class="lead">약 <b>10분</b>. 이 답으로 귀 병원 샘플 홈페이지를 바로 만들어 보여드립니다.</p>
<ul><li>✓ <b>모르는 칸은 비워도</b> 됩니다. 제작사가 공개 등록정보로 채웁니다.</li><li>✓ 중간에 닫아도 이 기기에 <b>자동 저장</b>됩니다.</li><li>✓ 끝나면 파일 하나가 내려받아집니다. <b>크몽 채팅에 첨부</b>해 주세요.</li></ul>
<button class="btn big" id="go">시작하기 →</button>
<p class="help" style="margin-top:20px">홈페이지에는 의료법 제57조 제3항 심의 제외 항목(명칭·주소·전화·진료과목·의료진·진료시간·시설·비급여 고지)만 싣습니다. 이 폼은 서버로 전송되지 않습니다.</p></div>`;
    document.getElementById("go").onclick=()=>{step=1;render();scrollTo(0,0)};return}
  if(step>n){const d=toJSON();main.innerHTML=`<div class="done"><h1>끝났습니다 👏</h1><p class="lead">아래 버튼으로 파일을 내려받아 크몽 채팅에 첨부해 주세요.</p>
<div class="box"><button class="btn big" id="dl">파일 내려받기 (${esc(d.name||"병원")}_사전정보.json)</button><div class="summary">${esc(summary(d))}</div></div>
<ol><li><b>1~2일 안</b>에 귀 병원 정보가 들어간 샘플 링크를 드립니다.</li><li>샘플 확인 후 결제. <b>수정 2회</b> 포함.</li><li>사진·약력·비급여표는 승인 단계에서 따로 받습니다.</li></ol>
<p><button class="ghost" id="back">← 수정하러 돌아가기</button></p></div>`;
    document.getElementById("dl").onclick=()=>download(d);document.getElementById("back").onclick=()=>{step=n;render()};return}
  document.getElementById("stepno").textContent=`${step}/${n}`;document.getElementById("steptitle").textContent=STEPS[step-1].t;
  main.innerHTML=STEPS[step-1].r();document.getElementById("skip").style.display="none";
  document.getElementById("next").textContent=step===n?"완료 →":"다음 →";
}
function validate(){
  let ok=true;for(const q of main.querySelectorAll(".q[data-req]")){const k=q.dataset.req;let bad=false;
    if(k==="depts")bad=!(S.depts.length||S.deptCustom.trim());else if(k==="days")bad=!DAYS.some(d=>S.days[d].on);else if(k==="doctors")bad=!S.doctors[0].name.trim();else bad=!S[k].trim();
    q.classList.toggle("bad",bad);if(bad)ok=false}
  return ok}
document.getElementById("next").onclick=()=>{if(!validate()){document.getElementById("skip").style.display="inline";main.querySelector(".q.bad")?.scrollIntoView({block:"center"});return}step++;render();scrollTo(0,0)};
document.getElementById("skip").onclick=()=>{step++;render();scrollTo(0,0)};
document.getElementById("prev").onclick=()=>{step--;render();scrollTo(0,0)};
document.getElementById("reset").onclick=()=>{if(confirm("입력한 내용을 모두 지우고 처음부터 할까요?")){S=blank();step=0;render()}};

// 입력 → 상태 (포커스 유지: 텍스트는 재렌더 안 함)
main.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.k){const k=t.dataset.k;if(k.startsWith("d."))S.days[k.slice(4)][k[2]]=t.value;else if(k.startsWith("l."))S.lunch[k[2]]=t.value;else S[k]=t.value}
  else if(t.dataset.field!==undefined)S.fields[t.dataset.field]=t.value;
  else if(t.dataset.doc){const[i,f]=t.dataset.doc.split(".");S.doctors[i][f]=t.value}
  t.closest(".q")?.classList.remove("bad");save()});
main.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.id)return;const d=b.dataset;
  if(d.set!==undefined){S[d.set]=d.v}
  else if(d.toggle){const a=S[d.toggle],i=a.indexOf(d.v);i<0?a.push(d.v):a.splice(i,1);if(d.toggle==="depts"&&i>=0)delete S.fields[d.v]}
  else if(d.day){S.days[d.day].on=!S.days[d.day].on}else if(d.lunch){S.lunch.on=!S.lunch.on}
  else if(d.preset){const p=d.preset;DAYS.forEach(x=>{const w=S.days[x];if(p==="c"){if(x==="토")w.on=false;return}w.on=x!=="일";w.s="09:00";w.e=x==="토"?(p==="a"?"13:00":"14:00"):(p==="a"?"18:00":"19:00")})}
  else if(d.add){S.doctors.push({name:"",title:"",spec:"",degree:"",career:""})}else if(d.rm){S.doctors.splice(+d.rm,1)}
  else if(d.concept){const a=S.concepts,i=a.indexOf(d.concept);if(i>=0){if(a.length>1)a.splice(i,1)}else{a.push(d.concept);if(a.length>2)a.shift()}}
  else if(d.pick){e.preventDefault();b.parentElement.querySelector("input[type=file]").click();return}
  else if(d.rmup){const[k,i]=d.rmup.split(".");S.uploads[k].splice(+i,1)}
  else return;
  e.preventDefault();render()});
// 사진: 긴 변 1600px · JPEG 0.8 로 줄여 data URL 로 보관 → JSON 에 함께 담김 (서버 없음)
main.addEventListener("change",async e=>{const t=e.target;if(!t.dataset.upin)return;const k=t.dataset.upin;S.uploads[k]=S.uploads[k]||[];
  for(const f of t.files){if(upCount()>=12){alert("사진은 최대 12장입니다.");break}
    try{const data=await shrink(f);S.uploads[k].push({name:f.name,data})}catch{alert(f.name+" 은(는) 읽을 수 없는 파일입니다.")}}
  render()});
function shrink(file){return new Promise((ok,no)=>{const img=new Image();img.onload=()=>{const m=1600,r=Math.min(1,m/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(img.src);ok(c.toDataURL("image/jpeg",.8))};img.onerror=no;img.src=URL.createObjectURL(file)})}

// ---------- 출력 (build.py 입력 스키마와 동일) ----------
const lines=s=>s.split("\n").map(x=>x.trim()).filter(Boolean),list=s=>s.split(",").map(x=>x.trim()).filter(Boolean);
function hoursOut(){const g=[];const key=d=>S.days[d].on?`${S.days[d].s} – ${S.days[d].e}`:"휴진";
  for(const d of DAYS){const k=key(d),h=g.find(x=>x.k===k);h?h.d.push(d):g.push({k,d:[d]})}
  const out=g.filter(x=>x.k!=="휴진").map(x=>[x.d.length===1?x.d[0]+"요일":x.d.join("·"),x.k]);
  if(S.lunch.on)out.push(["점심시간",`${S.lunch.s} – ${S.lunch.e}`]);
  const off=g.find(x=>x.k==="휴진");if(off)out.push([off.d.map(d=>d+"요일").join("·")+(off.d.includes("일")?"·공휴일":""),"휴진"]);else out.push(["공휴일","휴진"]);return out}
function toJSON(){const depts=[...S.depts,...list(S.deptCustom)];
  const features=S.sections.includes("features")?[...S.feats.map(k=>({icon:FEAT[k][0],title:FEAT[k][1],desc:FEAT[k][2]})),...lines(S.featExtra).map(t=>({icon:"",title:t,desc:""}))]:[];
  const fields=S.sections.includes("fields")?depts.map(d=>({dept:d,items:list(S.fields[d]||"")})).filter(x=>x.items.length):[];
  const 첨부=Object.entries(S.uploads).flatMap(([k,a])=>a.map(f=>({kind:k,name:f.name,data:f.data})));
  const main_c=CONCEPT[S.concepts[0]]||CONCEPT.classic;
  return{_기획:{concepts:S.concepts.map(k=>({key:k,name:CONCEPT[k].n})),color_name:S.color,mood:S.mood,font:S.font,photo_amount:S.photoAmt,density:S.density,style_note:S.styleNote,sections:S.sections,have:S.have,refs:S.refs,notes:S.notes,
      existing_site:S.existing,site_url:S.site_url.trim(),place_url:S.place_url.trim(),author:S.author.trim(),author_role:S.authorRole,
      received:new Date().toISOString().slice(0,10),form:"intake v2.1"},
    _첨부:첨부,
    draft:true,slug:(S.domain.split(".")[0]||"").replace(/[^a-z0-9-]/gi,"").toLowerCase()||"clinic",
    name:S.name.trim(),kind:S.kind,tagline:S.tagline.trim(),phone:S.phone.trim(),address:S.address.trim(),transport:"",parking:S.feats.includes("park")?"주차 가능 (상세 확인 필요)":"",
    departments:depts,concept:S.concepts[0]||"classic",hero_style:S.photoAmt==="none"&&main_c.hero==="photo"?"fact":"",color:COLOR[S.color]?.[0]||"",hours:hoursOut(),
    doctors:S.doctors.filter(d=>d.name.trim()).map(d=>({name:d.name.trim(),title:d.title.trim(),license:"의사 면허",specialty:d.spec.trim(),degree:d.degree.trim(),career:lines(d.career),photo:""})),
    features,fields,facilities:list(S.facilities),photos:[],hero_photo:"",logo:"",notices:[],nonpaid:[],
    booking_url:S.booking.trim(),kakao_url:S.kakao.trim(),blog_url:S.blog.trim(),founder:S.doctors[0]?.name.trim()||"",opened:S.opened.trim(),biz_no:"확인 필요",domain:S.domain.trim(),approved_by:"",approved_at:""}}
const summary=d=>`${d.name||"(명칭 없음)"} · ${d.kind} · ${d.departments.join(", ")||"과목 없음"}\n컨셉 ${S.concepts.map(k=>CONCEPT[k].n).join(" + ")} · ${COLOR[S.color]?.[1]||"색 추천"} · ${[...S.mood,FONT[S.font],PHOTO[S.photoAmt],DENSE[S.density]].filter(Boolean).join("·")||"취향 미입력"}\n의료진 ${d.doctors.length}명 · 차별점 ${S.feats.length}개 · 사진 ${d._첨부.length}장 · 진료시간 ${d.hours.map(h=>h.join(" ")).join(" / ")}\n작성 ${d._기획.author||"(성함 없음)"} (${d._기획.author_role})`;
function download(d){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download=(d.name||"병원")+"_사전정보.json";a.click()}
render();
</script>
